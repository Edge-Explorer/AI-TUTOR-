<!DOCTYPE html>
<html>

<head>
    <title>Backend Test</title>
</head>

<body>
    <h1>Testing Backend Connection</h1>
    <button onclick="testBackend()">Test Signup</button>
    <pre id="result"></pre>

    <script>
        async function testBackend() {
            const result = document.getElementById('result');
            result.textContent = 'Testing...';

            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'test@test.com',
                        username: 'testuser',
                        password: 'testpass123'
                    })
                });

                const data = await response.json();
                result.textContent = 'SUCCESS!\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                result.textContent = 'ERROR:\n' + error.message + '\n\nThis means CORS or network blocking!';
            }
        }
    </script>
</body>

</html>
